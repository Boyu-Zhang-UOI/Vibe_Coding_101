# Publishes the slide decks to GitHub Pages.
# Runs only for public repositories (Pages for private repos needs a paid plan).
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish slides

on:
  push:
    branches: [main]
    paths:
      - "weeks/**/slides.md"
      - "scripts/build-slides.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run slides
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5
