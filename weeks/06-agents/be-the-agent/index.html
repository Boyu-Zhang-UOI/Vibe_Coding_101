<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tip Splitter</title>
    <link rel="icon" href="data:," />
    <style>
      body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
      label { display: block; margin-top: 0.75rem; font-weight: 600; }
      input { font: inherit; padding: 0.4rem; width: 100%; box-sizing: border-box; }
      output { display: block; margin-top: 1.5rem; font-size: 1.2rem; }
      .error { color: #b42318; }
    </style>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <h1>Tip Splitter</h1>
    <form id="bill-form">
      <label for="bill">Bill (dollars)</label>
      <input id="bill" type="number" min="0" step="0.01" value="100" />
      <label for="tip">Tip (%)</label>
      <input id="tip" type="number" min="0" step="1" value="15" />
      <label for="people">People</label>
      <input id="people" type="number" min="1" step="1" value="3" />
    </form>
    <output id="result" aria-live="polite"></output>
  </body>
</html>
