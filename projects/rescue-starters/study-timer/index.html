<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study Log</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>Study Log</h1>

      <section aria-labelledby="timer-heading" class="card">
        <h2 id="timer-heading" class="visually-hidden">Timer</h2>
        <label for="subject">Subject</label>
        <select id="subject"></select>

        <form id="subject-form" class="row">
          <div class="grow">
            <label for="new-subject">New subject</label>
            <input id="new-subject" type="text" autocomplete="off" maxlength="40" />
          </div>
          <button type="submit">Add subject</button>
        </form>

        <p id="timer" class="timer" role="timer">00:00</p>
        <button id="start-stop" type="button" class="big">Start</button>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="week-heading" class="card">
        <h2 id="week-heading">This week (Mon–Sun)</h2>
        <ul id="totals" class="plain"></ul>
      </section>

      <section aria-labelledby="log-heading" class="card">
        <h2 id="log-heading">Log</h2>
        <ul id="log" class="plain"></ul>
      </section>

      <p class="muted small">Your log is saved in this browser only. Nothing is sent over the internet.</p>
    </main>
  </body>
</html>
