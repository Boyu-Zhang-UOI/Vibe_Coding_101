# Runs the automated tests on GitHub every time you push, and on pull requests.
# See the results in your repository's "Actions" tab. A red ✗ means a test failed.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
