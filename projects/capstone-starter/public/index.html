<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Change the title and heading to your capstone's name. -->
    <title>My Capstone</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>My Capstone</h1>
      <p class="intro">A starter shell. Replace the two example features below with your own app.</p>

      <!-- Example feature 1: browser-only logic (public/lib/items.js), saved in localStorage. -->
      <section aria-labelledby="list-heading" class="card">
        <h2 id="list-heading">Example: a saved list</h2>
        <form id="item-form" class="row">
          <label for="item-text" class="visually-hidden">New item</label>
          <input id="item-text" name="item" type="text" autocomplete="off" placeholder="Add an item" />
          <button type="submit">Add</button>
        </form>
        <p id="item-message" class="message" role="status" aria-live="polite"></p>
        <ul id="item-list"></ul>
        <p id="item-summary" class="muted"></p>
      </section>

      <!-- Example feature 2 (optional): a server route that calls an AI with a hidden key (api/ask.js). -->
      <section aria-labelledby="ask-heading" class="card">
        <h2 id="ask-heading">Example: ask the AI (server route)</h2>
        <form id="ask-form">
          <label for="question">Your question</label>
          <textarea id="question" name="question" rows="3" placeholder="Ask anything"></textarea>
          <div class="row spread">
            <span id="counter" class="muted" aria-live="polite"></span>
            <button id="ask-button" type="submit">Ask</button>
          </div>
        </form>
        <p id="ask-status" class="message" role="status" aria-live="polite"></p>
        <p id="answer" class="answer" hidden></p>
        <p class="muted small">Questions are sent to an AI provider. Please don't type personal information.</p>
      </section>
    </main>
  </body>
</html>
